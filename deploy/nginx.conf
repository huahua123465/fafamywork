# HTML 一律协商缓存：每次发布后 HTML 引用的 /assets/ 文件名会变，不能让浏览器用旧 HTML
map $sent_http_content_type $html_cache_control {
    ~*^text/html  "no-cache";
    default       "";
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/xml text/plain;
    gzip_min_length 1024;

    # 注意：nginx 里子 location 一旦出现 add_header，会丢弃这里继承下来的所有 add_header，
    # 所以带 add_header 的 location 里要把需要的头重新声明一遍。
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Cache-Control $html_cache_control always;  # 值为空时不会输出

    # 个人资料与访问统计接口
    location /api/ {
        proxy_pass http://api:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 15s;
        client_max_body_size 128k;
    }

    # 带 hash 的静态产物长期缓存
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # 图片素材
    location /images/ {
        add_header Cache-Control "public, max-age=2592000";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location = /sitemap.xml { expires 1h; }
    location = /robots.txt  { expires 1h; }
    location = /og-cover.png { expires 7d; }

    # 构建时已为每个页面预渲染出 <路径>/index.html；
    # 找不到对应文件的地址返回真正的 404 状态码（内容仍是站点的「页面未找到」页）
    location / {
        try_files $uri $uri/index.html =404;
    }
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}
